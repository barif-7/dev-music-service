[project]
name = "dev-music-service"
version = "0.1.0"
description = "FastAPI music service with browser-first playback and playlist import."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.1.0",
    "fastapi>=0.117,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
    "yt-dlp>=2025.1.0",
]

[project.scripts]
app = "app:app"
