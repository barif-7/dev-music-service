[project]
name = "dev-music-service"
version = "0.4.0"
description = "FastAPI music service with browser-first playback and playlist import"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.1.0",
    "cachetools>=5.5,<7.0",
    "fastapi>=0.117,<1.0",
    "httpx[http2]>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
    "yt-dlp==2026.3.17",
    "structlog>=24.0.0",
    "slowapi>=0.1.9",
    "limits>=3.0",
    "rapidfuzz>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = ["app", "config", "frontend", "main", "models", "security"]
packages = ["api", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
