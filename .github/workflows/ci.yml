name: CI

on:
  push:
    branches: [main, "chore/phase*"]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Lint extracted frontend
        run: |
          python scripts/lint_frontend.py

      - name: Run tests with pytest
        run: |
          ./test.sh
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run security check with bandit
        run: |
          bandit -r . -x ./tests,./.venv

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Type-check MCP server
        working-directory: mcp-server
        run: npx tsc --noEmit

      - name: Lint MCP server
        working-directory: mcp-server
        run: npm run lint

      - name: Test MCP server
        working-directory: mcp-server
        run: npm test

  import-check:
    runs-on: ubuntu-latest
    needs: [python, security, mcp-server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify package can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import main; assert main.app"
